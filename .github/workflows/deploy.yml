name: CD Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: europe-central2
  REPOSITORY: budget-repo
  SERVICE: budget-api
  WEB_BUCKET: ${{ vars.GCP_PROJECT_ID }}-web
  APP_DOMAIN: ${{ vars.APP_DOMAIN }}
  WEB_ORIGIN: https://${{ vars.APP_DOMAIN }}
  VPC_NETWORK: budget-vpc
  VPC_SUBNET: budget-private-api
  DB_HOST: 10.0.3.10
  DB_NAME: budget
  DB_USER: budget
  DB_SECRET: budget-db-password

jobs:
  build-and-test:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  deploy-app:
    name: Deploy App (Cloud Run)
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "${{ secrets.GCP_RUN_SA }}" \
            --network "$VPC_NETWORK" \
            --subnet "$VPC_SUBNET" \
            --network-tags api \
            --vpc-egress private-ranges-only \
            --ingress internal-and-cloud-load-balancing \
            --set-env-vars "DB_HOST=$DB_HOST,DB_NAME=$DB_NAME,DB_USER=$DB_USER,CORS_ALLOWED_ORIGINS=$WEB_ORIGIN,APP_VERSION=$GITHUB_SHA" \
            --set-secrets "DB_PASSWORD=$DB_SECRET:latest" \
            --cpu 1 \
            --memory 512Mi \
            --cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --allow-unauthenticated \
            --quiet
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  deploy-web:
    name: Deploy Web (Cloud Storage)
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-app]
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build -- --base=./
        env:
          VITE_API_BASE_URL: /api
          VITE_APP_VERSION: ${{ github.sha }}

      - run: printf '{"version":"%s"}\n' "$GITHUB_SHA" > dist/version.json

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish to bucket
        id: publish
        run: |
          gcloud storage rsync dist "gs://$WEB_BUCKET" --recursive --delete-unmatched-destination-objects
          gcloud storage objects update "gs://$WEB_BUCKET/index.html" "gs://$WEB_BUCKET/version.json" --cache-control=no-cache
          echo "url=$WEB_ORIGIN/" >> "$GITHUB_OUTPUT"

  healthcheck:
    name: Live healthcheck
    runs-on: ubuntu-latest
    needs: [deploy-app, deploy-web]
    env:
      RUN_URL: ${{ needs.deploy-app.outputs.url }}
    steps:
      - name: API health via HTTPS load balancer
        run: |
          for i in $(seq 1 12); do
            curl -fsS "$WEB_ORIGIN/actuator/health" | grep -q '"status":"UP"' && break
            sleep 10
          done
          curl -fsS "$WEB_ORIGIN/actuator/health"

      - name: API version
        run: |
          curl -fsS "$WEB_ORIGIN/actuator/info"
          test "$(curl -fsS "$WEB_ORIGIN/actuator/info" | jq -r .app.version)" = "$GITHUB_SHA"

      - name: API data
        run: curl -fsS "$WEB_ORIGIN/api/budgets" | jq length

      - name: Web version
        run: |
          curl -fsS "$WEB_ORIGIN/" | grep -q '<div id="root">'
          curl -fsS "$WEB_ORIGIN/version.json"
          test "$(curl -fsS "$WEB_ORIGIN/version.json" | jq -r .version)" = "$GITHUB_SHA"

      - name: HTTP to HTTPS redirect
        run: |
          curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' "http://$APP_DOMAIN/" | tee redirect.txt
          grep -Eq "^30[18] https://$APP_DOMAIN/" redirect.txt

      - name: Cloud Run not reachable directly
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$RUN_URL/api/budgets")
          echo "$RUN_URL -> $CODE"
          test "$CODE" != "200"

      - name: Summary
        run: |
          {
            echo "| Warstwa | URL | Wersja |"
            echo "|---|---|---|"
            echo "| Web | $WEB_ORIGIN/ | ${GITHUB_SHA::7} |"
            echo "| App | $WEB_ORIGIN/api | ${GITHUB_SHA::7} |"
          } >> "$GITHUB_STEP_SUMMARY"
